<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Horarios 2026-27 · CDP Torrealba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css?v=6">
<link rel="stylesheet" href="assets/css/horarios.css?v=2">
</head>
<body>

<main>
  <barra-nav pagina="Horarios 2026-27">
    <a href="index.html" class="btnVolver">← Volver a la intranet</a>
  </barra-nav>

  <h1 class="titulo">Horarios curso <span id="curso">2026-27</span></h1>
  <p class="subtitulo">Propuestas generadas con Peñalara · Jefatura de estudios</p>

  <div id="bannerDefinitivo" hidden>
    <span class="sello">DEFINITIVO</span>
    <h2 id="tituloDefinitivo"></h2>
    <small id="detalleDefinitivo"></small>
  </div>

  <div id="cargando">Cargando propuestas…</div>
  <div id="error" hidden></div>

  <div id="zonaPropuestas" hidden>
    <div class="selectorIteracion">
      <label for="selIteracion">Iteración:</label>
      <select id="selIteracion" class="control"></select>
    </div>
    <div id="chips"></div>
    <p id="notaIteracion"></p>

    <div id="controles">
      <div class="pestanas">
        <button id="tabProf" class="activa">Por profesor</button>
        <button id="tabGrupo">Por curso</button>
      </div>
      <select id="selector" class="control"></select>
      <div class="navegacion">
        <button id="btnAnterior" title="Anterior">◀</button>
        <button id="btnSiguiente" title="Siguiente">▶</button>
      </div>
      <button id="btnImprimir">Imprimir</button>
      <button id="btnTodos">Descargar todos (PDF)</button>
    </div>

    <div id="titularVista"></div>
    <div id="cuadricula"></div>
    <div id="impresionMasiva" hidden></div>
    <p id="vacio" hidden>Elige un profesor o curso para ver su horario.</p>
  </div>
</main>

<script src="assets/js/nav.js?v=1" defer></script>
<script type="module" src="assets/js/horarios/app.js?v=1"></script>
</body>
</html>
