<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Horarios 2026-27 · CDP Torrealba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css?v=4">
<link rel="stylesheet" href="assets/css/horarios.css?v=2">
</head>
<body>

<main>
  <nav class="navSuperior">
    <a href="index.html" class="btnVolver">← Volver a la intranet</a>
    <span class="migas">
      <a href="index.html">Intranet</a>
      <span class="sep">›</span>
      <span class="actual">Horarios 2026-27</span>
    </span>
  </nav>

  <h1 class="titulo">Horarios curso <span id="curso">2026-27</span></h1>
  <p class="subtitulo">Propuestas generadas con Peñalara · Jefatura de estudios</p>

  <div id="bannerDefinitivo" hidden>
    <span class="sello">DEFINITIVO</span>
    <h2 id="tituloDefinitivo"></h2>
    <small id="detalleDefinitivo"></small>
  </div>

  <div id="cargando">Cargando propuestas…</div>
  <div id="error" hidden></div>

  <div id="zonaPropuestas" hidden>
    <div class="selectorIteracion">
      <label for="selIteracion">Iteración:</label>
      <select id="selIteracion" class="control"></select>
    </div>
    <div id="chips"></div>
    <p id="notaIteracion"></p>

    <div id="controles">
      <div class="pestanas">
        <button id="tabProf" class="activa">Por profesor</button>
        <button id="tabGrupo">Por curso</button>
      </div>
      <select id="selector" class="control"></select>
      <div class="navegacion">
        <button id="btnAnterior" title="Anterior">◀</button>
        <button id="btnSiguiente" title="Siguiente">▶</button>
      </div>
      <button id="btnImprimir">Imprimir</button>
      <button id="btnTodos">Descargar todos (PDF)</button>
    </div>

    <div id="titularVista"></div>
    <div id="cuadricula"></div>
    <div id="impresionMasiva" hidden></div>
    <p id="vacio" hidden>Elige un profesor o curso para ver su horario.</p>
  </div>
</main>

<script>
"use strict";
const RUTA_DATOS = "data/";
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

let manifest = null;        // contenido de manifest.json
let iterIdx = -1;           // iteración seleccionada (índice en manifest.iteraciones)
let propIdx = -1;           // propuesta activa dentro de la iteración
let cacheDatos = new Map(); // "fecha/archivo" -> datos parseados
let modo = "prof";
let seleccion = "";

/* ---------- Parseo del XML GHC ---------- */
function decodificar(buffer){
  const cabecera = new TextDecoder("ascii").decode(buffer.slice(0,120));
  const m = cabecera.match(/encoding="([^"]+)"/i);
  const enc = m ? m[1].toLowerCase() : "utf-8";
  return new TextDecoder(enc).decode(buffer);
}

function parsearGHC(texto){
  const doc = new DOMParser().parseFromString(texto, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML no válido");
  const txt = (el, sel) => { const n = el.querySelector(sel); return n ? n.textContent.trim() : ""; };

  const marcos = new Map();
  doc.querySelectorAll("marcosDeHorario > marcoHorario").forEach(mh => {
    const id = mh.getAttribute("id");
    mh.querySelectorAll(":scope > tramo").forEach(tr => {
      marcos.set(`${id}|${txt(tr,"dia")}|${txt(tr,"indice")}`, {
        ini: txt(tr,"horaEntrada").slice(0,5),
        fin: txt(tr,"horaSalida").slice(0,5),
        tipo: txt(tr,"Tipo")
      });
    });
  });

  const sesiones = new Map();
  doc.querySelectorAll("sesionesLectivas > sesion").forEach(s => {
    // Peñalara declara aquí las materias compartidas: una sesión tiene un grupo
    // y un profesor "principales", y los demás cuelgan de otrosGrupos/otrosProfesores.
    const otrosG = [...s.querySelectorAll("otrosGrupos > grupo")].map(g => g.textContent.trim());
    const otrosP = [...s.querySelectorAll("otrosProfesores > profesor")].map(p => p.textContent.trim());
    sesiones.set(s.getAttribute("id"), {
      materia: txt(s,"materia"),
      grupo:   txt(s,"grupo"),
      grupos:      [txt(s,"grupo"),   ...otrosG].filter(Boolean),
      profesores:  [txt(s,"profesor"), ...otrosP].filter(Boolean)
    });
  });

  const reuniones = new Map();
  doc.querySelectorAll("reuniones > reunion").forEach(r => {
    reuniones.set(txt(r,"nombre"),
      [...r.querySelectorAll("integrantes > integrante")].map(i => i.textContent.trim()));
  });

  const porProf = new Map(), porGrupo = new Map();
  const meter = (mapa, clave, item) => {
    if (!mapa.has(clave)) mapa.set(clave, []);
    mapa.get(clave).push(item);
  };
  doc.querySelectorAll("horario > tramo").forEach(tr => {
    const dia = +tr.getAttribute("dia"), indice = tr.getAttribute("indice"),
          marco = tr.getAttribute("marco");
    const franja = marcos.get(`${marco}|${dia}|${indice}`);
    if (!franja) return;
    tr.querySelectorAll(":scope > aula").forEach(aula => {
      const ses = sesiones.get(txt(aula,"sesion"));
      if (!ses) return;
      const profAula = txt(aula,"profesor");
      // El profesor del tramo puede no estar en la lista de la sesión: lo añadimos
      const profesores = ses.profesores.includes(profAula)
        ? ses.profesores : [profAula, ...ses.profesores];
      const grupos = ses.grupos;
      const base = { dia, ini:franja.ini, fin:franja.fin, materia:ses.materia };
      const compartida = grupos.length > 1 || profesores.length > 1;

      // Una clase compartida es UNA sola clase: aparece una vez en el horario de
      // cada profesor implicado (mostrando todos los grupos) y una vez en el de
      // cada grupo implicado (mostrando todos los profesores).
      const masDeUnProf = profesores.length > 1;
      profesores.forEach(p => {
        const otros = profesores.filter(x => x !== p);
        const notas = [];
        if (grupos.length > 1) notas.push(`Grupos juntos: ${grupos.join(", ")}`);
        if (otros.length)      notas.push(`Con: ${otros.join(", ")}`);
        meter(porProf, p, {...base, grupo:ses.grupo, detalle: grupos.join(" · "),
                           compartida, nota: notas.join(" · ")});
      });
      grupos.forEach(g => {
        const otros = grupos.filter(x => x !== g);
        const notas = [];
        if (otros.length)   notas.push(`Junto a: ${otros.join(", ")}`);
        if (masDeUnProf)    notas.push(`Profesores: ${profesores.join(", ")}`);
        meter(porGrupo, g, {...base, grupo:ses.grupo, detalle: profesores.join(" · "),
                            compartida, nota: notas.join(" · ")});
      });
    });
    tr.querySelectorAll(":scope > reunion").forEach(re => {
      const nombre = re.textContent.trim();
      (reuniones.get(nombre) || []).forEach(p =>
        meter(porProf, p, { dia, ini:franja.ini, fin:franja.fin,
                            materia:nombre, detalle:"Reunión", reunion:true }));
    });
  });

  const recreos = [];
  marcos.forEach(f => {
    if (f.tipo === "recreo" && !recreos.some(r => r.ini===f.ini && r.fin===f.fin))
      recreos.push({ini:f.ini, fin:f.fin});
  });

  return {
    porProf, porGrupo, recreos,
    profesores: [...porProf.keys()].sort((a,b)=>a.localeCompare(b,"es")),
    grupos: [...porGrupo.keys()].sort((a,b)=>a.localeCompare(b,"es"))
  };
}

// Hash FNV-1a: se usa solo para elegir el punto de partida de la paleta,
// de forma que cada profesor/curso tenga su propia gama pero siempre la misma.
function hash32(txt){
  let h = 0x811c9dc5;
  for (let i = 0; i < txt.length; i++){
    h ^= txt.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h;
}

// Construye una paleta para el horario que se está mostrando.
// El color identifica la pareja materia+grupo: un profesor que da la misma
// asignatura en varios cursos ve un color distinto en cada uno. Los tonos se
// reparten por el círculo cromático para que queden bien diferenciados.
function construirPaleta(items, semilla){
  const claves = [...new Set(
    items.filter(i => !i.reunion).map(i => `${i.materia}|${i.grupo || ""}`)
  )].sort((a,b) => a.localeCompare(b,"es"));

  const paleta = new Map();
  const n = claves.length || 1;
  const inicio = hash32(String(semilla)) % 360;   // gama propia de cada profesor/curso
  claves.forEach((clave, i) => {
    const tono = Math.round(inicio + i * (360 / n)) % 360;
    const sat  = i % 2 ? 46 : 38;                 // alterna para separar aún más
    const luz  = i % 3 === 1 ? 86 : 89;           // texto negro siempre legible
    paleta.set(clave, `hsl(${tono} ${sat}% ${luz}%)`);
  });
  return paleta;
}

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const iterActual = () => manifest.iteraciones[iterIdx];
const nombrePropuesta = archivo =>
  archivo.replace(/\.xml$/i,"")           // quita extensión
    .replace(/^\d{8}[-_]?/,"")            // quita prefijo de fecha AAAAMMDD
    .replace(/[-_]/g," ")
    .trim()
    .replace(/^./, c=>c.toUpperCase());
const fechaBonita = valor => {
  // Acepta AAAAMMDD o AAAA-MM-DD
  const s = String(valor).replace(/-/g,"");
  const iso = `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  return new Date(iso+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
};

async function datosDePropuesta(iter, archivo){
  const clave = iter.fecha + "/" + archivo;
  if (!cacheDatos.has(clave)){
    const resp = await fetch(RUTA_DATOS + clave);
    if (!resp.ok) throw new Error(`No se encontró ${clave}`);
    cacheDatos.set(clave, parsearGHC(decodificar(await resp.arrayBuffer())));
  }
  return cacheDatos.get(clave);
}

/* ---------- Arranque ---------- */

// Aplica las marcas de ocultación del manifest. Los archivos siguen en el
// repositorio: simplemente no se muestran. Admite ocultar una iteración
// entera ("oculta": true) o propuestas sueltas ("ocultas": [...]).
function filtrarOcultos(man){
  const visibles = (man.iteraciones || [])
    .filter(it => it.oculta !== true)
    .map(it => {
      const ocultas = new Set(it.ocultas || []);
      const propuestas = (it.propuestas || []).filter(p => !ocultas.has(p));
      const copia = { ...it, propuestas };
      // Si la propuesta marcada como definitiva se ha ocultado, retiramos la
      // marca: no tiene sentido anunciar un horario que no se puede abrir.
      if (copia.aprobada && !propuestas.includes(copia.aprobada)) delete copia.aprobada;
      return copia;
    })
    // Una iteración sin propuestas visibles no se muestra
    .filter(it => it.propuestas.length > 0);

  man.iteraciones = visibles;
  return man;
}

async function iniciar(){
  try {
    const resp = await fetch(RUTA_DATOS + "manifest.json", {cache:"no-store"});
    if (!resp.ok) throw new Error("No se pudo cargar manifest.json");
    manifest = filtrarOcultos(await resp.json());
    if (!manifest.iteraciones.length)
      throw new Error("No hay ninguna propuesta visible en manifest.json");
    // Iteraciones ordenadas de más antigua a más reciente
    const norm = f => String(f).replace(/-/g,"");
    manifest.iteraciones.sort((a,b) => norm(a.fecha).localeCompare(norm(b.fecha)));
    $("curso").textContent = manifest.curso || "";
    iterIdx = manifest.iteraciones.length - 1;
    propIdx = 0;
    $("cargando").hidden = true;
    $("zonaPropuestas").hidden = false;
    await refrescarTodo();
  } catch(e){
    $("cargando").hidden = true;
    $("error").hidden = false;
    $("error").textContent = "Error al cargar los horarios: " + e.message;
  }
}

/* ---------- Render general ---------- */
async function refrescarTodo(){
  pintarBannerDefinitivo();
  pintarSelectorIteracion();
  pintarChips();
  await pintarSelectorYCuadricula();
}

function pintarBannerDefinitivo(){
  const ultima = manifest.iteraciones[manifest.iteraciones.length-1];
  const hay = ultima && ultima.aprobada;
  $("bannerDefinitivo").hidden = !hay;
  if (hay){
    $("tituloDefinitivo").textContent =
      `Horario definitivo: ${nombrePropuesta(ultima.aprobada)}`;
    $("detalleDefinitivo").textContent =
      `Iteración del ${fechaBonita(ultima.fecha)}` + (ultima.nota ? ` · ${ultima.nota}` : "");
  }
}

function pintarSelectorIteracion(){
  const sel = $("selIteracion");
  sel.innerHTML = manifest.iteraciones.map((it,i) =>
    `<option value="${i}"${i===iterIdx?" selected":""}>${fechaBonita(it.fecha)}${it.aprobada?" ★":""}</option>`
  ).reverse().join("");
  sel.parentElement.style.display = manifest.iteraciones.length > 1 ? "" : "none";
}

function pintarChips(){
  const it = iterActual();
  $("chips").innerHTML = "";
  it.propuestas.forEach((archivo,i) => {
    const chip = document.createElement("button");
    chip.className = "chip" + (i===propIdx ? " activa" : "");
    chip.innerHTML = (it.aprobada===archivo ? `<span class="estrella">★</span>` : "") +
      `<span>${nombrePropuesta(archivo)}</span>`;
    chip.addEventListener("click", async () => { propIdx = i; await refrescarTodo(); });
    $("chips").appendChild(chip);
  });
  $("notaIteracion").textContent = it.nota || "";
}

/* ---------- Visor ---------- */
async function pintarSelectorYCuadricula(){
  const it = iterActual();
  let datos;
  try {
    datos = await datosDePropuesta(it, it.propuestas[propIdx]);
  } catch(e){
    $("cuadricula").innerHTML = "";
    $("titularVista").textContent = "";
    $("vacio").hidden = true;
    $("error").hidden = false;
    $("error").textContent = e.message;
    return;
  }
  $("error").hidden = true;

  const lista = modo==="prof" ? datos.profesores : datos.grupos;
  if (!lista.includes(seleccion)) seleccion = "";
  $("selector").innerHTML =
    `<option value="">— Elegir ${modo==="prof"?"profesor":"curso"} —</option>` +
    lista.map(n => `<option${n===seleccion?" selected":""}>${n}</option>`).join("");
  actualizarBotonesNav(lista);
  pintarCuadricula(datos);
}

function actualizarBotonesNav(lista){
  const idx = seleccion ? lista.indexOf(seleccion) : -1;
  $("btnAnterior").disabled = idx <= 0;
  $("btnSiguiente").disabled = idx < 0 || idx >= lista.length-1;
}

async function navegar(dir){
  const it = iterActual();
  const datos = await datosDePropuesta(it, it.propuestas[propIdx]);
  const lista = modo==="prof" ? datos.profesores : datos.grupos;
  const idx = seleccion ? lista.indexOf(seleccion) : -1;
  const nuevo = idx + dir;
  if (nuevo >= 0 && nuevo < lista.length){
    seleccion = lista[nuevo];
    $("selector").value = seleccion;
    actualizarBotonesNav(lista);
    pintarCuadricula(datos);
  }
}

// Construye la <table> del horario de un profesor/curso concreto.
// No depende de la selección actual, así se reutiliza para "imprimir todos".
function construirTabla(datos, nombre){
  const items = (modo==="prof" ? datos.porProf : datos.porGrupo).get(nombre) || [];
  const paleta = construirPaleta(items, nombre);
  const dias = [...new Set(items.map(i=>i.dia))].sort((a,b)=>a-b);
  const diasVista = dias.length ? [...Array(Math.max(...dias)+1).keys()] : [0,1,2,3,4];

  const franjas = new Map();
  items.forEach(i => franjas.set(i.ini+"|"+i.fin, {ini:i.ini, fin:i.fin}));
  datos.recreos.forEach(r => franjas.set(r.ini+"|"+r.fin, {...r, recreo:true}));
  const filas = [...franjas.values()].sort((a,b)=> a.ini.localeCompare(b.ini) || a.fin.localeCompare(b.fin));

  const tabla = document.createElement("table");
  tabla.className = "horario";
  tabla.innerHTML = `<thead><tr><th></th>${diasVista.map(d=>`<th>${DIAS[d]}</th>`).join("")}</tr></thead>`;
  const cuerpo = document.createElement("tbody");

  filas.forEach(f => {
    const fila = document.createElement("tr");
    const celdas = diasVista.map(d => {
      const aqui = items.filter(i => i.dia===d && i.ini===f.ini && i.fin===f.fin);
      if (!aqui.length) return "<td></td>";
      return "<td class='" + (aqui[0].reunion?"reunion":"") + "'>" + aqui.map(i =>
        `<div class="bloque${i.compartida?" compartida":""}"${i.nota?` title="${i.nota}"`:""} style="background:${i.reunion?'':paleta.get(`${i.materia}|${i.grupo || ""}`)}">
           <span class="materia">${i.materia}</span>
           <span class="detalle">${i.detalle}</span></div>`).join("") + "</td>";
    });
    if (f.recreo && !items.some(i=>i.ini===f.ini && i.fin===f.fin)){
      fila.className = "recreo";
      fila.innerHTML = `<td class="hora">${f.ini}–${f.fin}</td><td colspan="${diasVista.length}">Recreo</td>`;
    } else {
      fila.innerHTML = `<td class="hora">${f.ini}–${f.fin}</td>` + celdas.join("");
    }
    cuerpo.appendChild(fila);
  });
  tabla.appendChild(cuerpo);
  return tabla;
}

function pintarCuadricula(datos){
  const cont = $("cuadricula"), tit = $("titularVista");
  cont.innerHTML = ""; tit.textContent = "";
  $("vacio").hidden = !!seleccion;
  if (!seleccion) return;

  const it = iterActual();
  tit.innerHTML = `${seleccion} <span class="propTag">${nombrePropuesta(it.propuestas[propIdx])} · ${fechaBonita(it.fecha)}</span>`;
  cont.appendChild(construirTabla(datos, seleccion));
}

/* ---------- Eventos ---------- */
$("selIteracion").addEventListener("change", async e => {
  iterIdx = +e.target.value;
  propIdx = 0;
  seleccion = "";
  await refrescarTodo();
});
$("tabProf").addEventListener("click", async () => { modo="prof"; seleccion=""; marcarTabs(); await pintarSelectorYCuadricula(); });
$("tabGrupo").addEventListener("click", async () => { modo="grupo"; seleccion=""; marcarTabs(); await pintarSelectorYCuadricula(); });
function marcarTabs(){
  $("tabProf").classList.toggle("activa", modo==="prof");
  $("tabGrupo").classList.toggle("activa", modo==="grupo");
}
$("selector").addEventListener("change", async e => {
  seleccion = e.target.value;
  const it = iterActual();
  const datos = await datosDePropuesta(it, it.propuestas[propIdx]);
  actualizarBotonesNav(modo==="prof" ? datos.profesores : datos.grupos);
  pintarCuadricula(datos);
});
$("btnAnterior").addEventListener("click", () => navegar(-1));
$("btnSiguiente").addEventListener("click", () => navegar(1));
$("btnImprimir").addEventListener("click", () => {
  document.body.classList.remove("imprimir-todos");
  window.print();
});

// Descargar todos: despliega el horario de cada profesor/curso de la propuesta
// actual (uno por página) y abre el diálogo de impresión → "Guardar como PDF".
$("btnTodos").addEventListener("click", async () => {
  const btn = $("btnTodos");
  const textoOriginal = btn.textContent;
  const cont = $("impresionMasiva");

  const limpiar = () => {
    document.body.classList.remove("imprimir-todos");
    cont.hidden = true;
    cont.innerHTML = "";
    document.title = "Horarios · CDP Torrealba";
    btn.disabled = false;
    btn.textContent = textoOriginal;
  };

  btn.disabled = true;
  btn.textContent = "Preparando…";
  cont.innerHTML = "";   // partir siempre de cero, no acumular ejecuciones previas

  try {
    const it = iterActual();
    const datos = await datosDePropuesta(it, it.propuestas[propIdx]);
    const lista = modo==="prof" ? datos.profesores : datos.grupos;
    const etiquetaProp = `${nombrePropuesta(it.propuestas[propIdx])} · ${fechaBonita(it.fecha)}`;
    const rotulo = modo==="prof" ? "profesor" : "curso";

    lista.forEach(nombre => {
      const bloque = document.createElement("section");
      bloque.className = "hojaHorario";
      const h = document.createElement("div");
      h.className = "tituloHoja";
      h.innerHTML = `${nombre} <span class="propTag">${etiquetaProp}</span>`;
      bloque.appendChild(h);
      bloque.appendChild(construirTabla(datos, nombre));
      cont.appendChild(bloque);
    });
    cont.hidden = false;
    document.body.classList.add("imprimir-todos");
    document.title = `Horarios por ${rotulo} — ${etiquetaProp}`;

    // Limpiar en cuanto el diálogo se cierre
    window.addEventListener("afterprint", limpiar, { once:true });

    await new Promise(r => setTimeout(r, 80));  // esperar al render
    window.print();
  } catch (e) {
    alert("No se pudo preparar la descarga: " + e.message);
    limpiar();
  }
});

iniciar();
</script>
</body>
</html>
